server {
    listen 80;
    server_name _;

    # nginx's default is 1 MB. Largest legitimate request: profile photo (5 MB)
    # + ID card or CV (10 MB) + up to 5 certificates (10 MB each).
    client_max_body_size 70m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    # ID cards, CVs and certificates are private: only the authenticated
    # Django routes (owner, or admin) may serve them.
    location /media/verification-documents/ {
        return 404;
    }

    location /media/ {
        alias /app/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}