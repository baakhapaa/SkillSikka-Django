<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting to eSewa…</title>
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7faf9;color:#172b2f;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
        button{background:#60bb46;color:#fff;border:0;border-radius:6px;padding:14px 22px;font-size:16px;font-weight:600}
        p{color:#718084}
    </style>
</head>
<body>
    <form id="esewa" method="post" action="{{ action }}">
        {% for name, value in fields.items %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
        <h1>Redirecting to eSewa…</h1>
        <p>Paying Rs. {{ payment.amount }} for “{{ payment.course.title }}”.</p>
        <noscript><button type="submit">Continue to eSewa</button></noscript>
    </form>
    <script>document.getElementById('esewa').submit();</script>
</body>
</html>
