<div class="sidebar-footer">
    <div class="sidebar-profile">
        <div class="avatar">{{ request.user.name|slice:':1'|upper }}</div>
        <div class="sidebar-profile-details"><strong>{{ request.user.name }}</strong><small>{{ request.user.role.name|default:'Administrator' }}</small></div>
    </div>
    <form class="logout-form" method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="logout-button" type="submit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            <span>Logout</span>
        </button>
    </form>
</div>
